<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parents Meet AI</title>
<meta name="description" content="Parents learning about AI together — a friendly parent-to-parent discussion community.">
<meta name="theme-color" content="#2D5BD1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMA">
<meta name="application-name" content="PMA">
<meta name="keywords" content="PMA, Parents Meet AI, parents, AI, parenting, homework help, education, community">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F6F8FC; --surface:#fff; --ink:#14213D; --muted:#64707B; --line:#E3E8F2;
    --green:#2D5BD1; --green-dark:#2349B0; --mint:#E4ECFF; --orange:#FF7A59; --peach:#FFE9E2;
    --red:#B3412F; --heart:#E0565B; --shadow:0 8px 24px rgba(20,33,43,.07);
    --navh:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .hidden{display:none!important}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:600;border:1px solid transparent;font-size:15px;background:none}
  .btn-primary{background:var(--green);color:#fff}
  .btn-primary:hover{background:var(--green-dark)}
  .btn-primary:disabled{opacity:.6;cursor:default}
  .btn-ghost{background:var(--surface);border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--green)}
  .btn-danger{background:var(--surface);border-color:#F0C9C2;color:var(--red)}
  .btn-block{width:100%}
  .btn-big{padding:16px 22px;font-size:17px;border-radius:16px}
  .link{background:none;border:0;color:var(--green);font-weight:600;padding:0;font-size:14px}
  .muted{color:var(--muted)}
  .err{color:var(--red);font-size:14px;min-height:20px;margin-top:6px}
  .ok{color:var(--green);font-size:14px;min-height:20px;margin-top:6px}
  input[type=text],input[type=email],input[type=password],input[type=search],textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
  textarea{resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:transparent}
  label.field{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  .lang{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
  .logo{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-size:17px;flex:none}
  .brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:19px;font-weight:600}
  .brand span{color:var(--orange)}

  /* avatars */
  .av{border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;object-fit:cover;background:#ccc}
  .av-s{width:36px;height:36px;font-size:15px}
  .av-m{width:44px;height:44px;font-size:18px}
  .av-l{width:88px;height:88px;font-size:34px}

  /* setup / loading */
  #setup{max-width:600px;margin:60px auto;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
  #setup code{background:var(--bg);padding:2px 6px;border-radius:6px}
  #loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}

  /* ---------- auth ---------- */
  #auth{min-height:100vh;display:flex;flex-direction:column}
  .auth-hero{background:linear-gradient(160deg,var(--mint),var(--peach));padding:22px 0 34px}
  .auth-hero h1{font-size:clamp(34px,8vw,52px);line-height:1.05;margin:28px 0 10px}
  .auth-hero{position:relative;overflow:hidden}
  .auth-hero h1 em{color:var(--green)}
  .auth-hero p{color:var(--muted);font-size:17px;margin:0}
  .auth-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);margin:-14px auto 30px;max-width:440px;width:calc(100% - 32px)}
  .tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px}
  .tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
  .tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:16px 0 4px;color:var(--muted)}
  .check input{margin-top:3px;width:18px;height:18px;accent-color:var(--green);flex:none}

  /* ---------- app shell ---------- */
  #app{min-height:100vh;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 8px)}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(246,248,252,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar .wrap{height:56px;display:flex;align-items:center;gap:8px}
  .topbar h2{font-size:19px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .back{background:none;border:0;font-size:24px;padding:4px 8px 4px 0;line-height:1;color:var(--ink)}
  nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav.tabbar .wrap{display:flex;height:var(--navh);padding:0}
  nav.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;position:relative}
  nav.tabbar a .ic{font-size:21px;line-height:1}
  nav.tabbar a.active{color:var(--green)}
  .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--orange);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
  main#view{padding-top:14px;padding-bottom:20px}

  /* home */
  .hello{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--mint),var(--peach));border-radius:22px;padding:24px 20px;margin-bottom:18px}
  .hello h1{font-size:32px;line-height:1.1}
  .hello h1 span{color:var(--orange)}
  .hello p{margin:6px 0 18px;color:var(--muted);font-size:17px}
  .section-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
  .section-title h3{font-size:20px}
  .ideas{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .ideas::-webkit-scrollbar{display:none}
  .idea{flex:none;max-width:250px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
  .idea:hover{border-color:var(--green)}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .post-card{cursor:pointer;transition:box-shadow .15s}
  .post-card:hover{box-shadow:var(--shadow)}
  .who{display:flex;align-items:center;gap:10px}
  .who .n{font-weight:600;font-size:15px;line-height:1.2}
  .who .t{color:var(--muted);font-size:13px}
  .who .namebtn{background:none;border:0;padding:0;text-align:left}
  .post-title{font-family:Fraunces,serif;font-size:19px;font-weight:600;line-height:1.3;margin:12px 0 4px;overflow-wrap:anywhere}
  .post-body{color:#34414C;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
  .clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .bar{display:flex;align-items:center;gap:6px;margin-top:12px}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted)}
  .pill.liked{color:var(--heart);border-color:#F6C9CA;background:#FFF4F4}
  .pill:disabled{opacity:.6}
  .more{margin-left:auto;display:flex;gap:4px}
  .mini{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px}
  .mini:hover{background:var(--bg);color:var(--ink)}
  .mini.danger:hover{color:var(--red)}

  .toolbar{display:flex;gap:8px;margin-bottom:12px}
  .locbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px}
  .loc-select{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:15px;color:var(--ink)}
  .loc-select:focus{outline:2px solid var(--green);border-color:transparent}
  .seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
  .seg button.active{background:var(--mint);color:var(--green-dark)}
  .empty{text-align:center;color:var(--muted);padding:36px 12px}
  .empty .big{font-size:36px}

  /* discussion */
  .op{border-color:#CFDCFB}
  .op .post-title{font-size:23px}
  .reply{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .reply:last-child{border-bottom:0}
  .reply .content{flex:1;min-width:0}
  .reply .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .reply .body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
  .reply .bar{margin-top:6px}
  .reply .pill{padding:3px 10px;font-size:13px}
  .composer{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));z-index:25;background:rgba(246,248,252,.97);border-top:1px solid var(--line)}
  .composer .wrap{display:flex;gap:8px;align-items:flex-end;padding-top:10px;padding-bottom:10px}
  .composer textarea{resize:none;min-height:46px;max-height:140px}
  .composer .btn{height:46px}
  .has-composer{padding-bottom:84px}

  /* messages */
  .conv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;cursor:pointer;background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
  .conv:hover{border-color:var(--green)}
  .conv .mid{flex:1;min-width:0}
  .conv .last{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv.unread .last{color:var(--ink);font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);flex:none}
  .thread{display:flex;flex-direction:column;gap:6px}
  .bubble{max-width:78%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
  .bubble.me{align-self:flex-end;background:var(--green);color:#fff;border-color:var(--green)}
  .bubble .tm{display:block;font-size:11px;opacity:.7;margin-top:2px}
  .day{align-self:center;font-size:12px;color:var(--muted);margin:8px 0}

  /* profile */
  .prof{text-align:center;padding:22px 16px}
  .prof .av-l{margin:0 auto 10px}
  .prof h2{font-size:24px}
  .prof .bio{color:var(--muted);margin:6px 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}
  .avatar-edit{position:relative;display:inline-block;cursor:pointer}
  .avatar-edit .cam{position:absolute;right:-2px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:15px}
  .settings button.row{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;text-align:left;font-size:15px}
  .settings button.row:last-child{border-bottom:0}
  .settings .row span:last-child{color:var(--muted)}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(20,33,43,.45);display:grid;place-items:center;padding:16px;z-index:60}
  .modal .card{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;margin:0}
  .modal h3{font-size:21px;margin-bottom:4px}
  .row-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:calc(var(--navh) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:90%}
  .getapp{display:inline-flex;align-items:center;gap:5px;background:var(--green);color:#fff;border:0;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap;flex:none;box-shadow:0 2px 8px rgba(45,91,209,.25)}
  .getapp:hover{background:var(--green-dark)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .chip-open{background:var(--peach);border-color:#F3D3B7;color:#9A5421}
  .chip-ok{background:#DDF4E6;border-color:#BFE6CD;color:#1E7A45}
  .card-main{display:flex;gap:12px;align-items:flex-start}
  .thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none;margin-top:12px;border:1px solid var(--line)}
  .hw-photo{display:block;width:100%;max-height:420px;object-fit:contain;background:var(--bg);border-radius:14px;margin:10px 0;border:1px solid var(--line);cursor:zoom-in}
  .photo-modal{background:rgba(0,0,0,.85);cursor:zoom-out}
  .photo-modal img{max-width:100%;max-height:92vh;border-radius:8px}
  .photo-preview{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .photo-preview img{max-width:100%;max-height:260px;border-radius:12px;border:1px solid var(--line)}
  .privacy-tip{font-size:13px;color:#8A5A2B;background:var(--peach);border-radius:10px;padding:8px 12px;margin-top:10px}
  .filters{display:flex;gap:8px;margin-bottom:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .two .loc-select{width:100%}
  .two > div{min-width:0}
  @media (max-width:420px){ nav.tabbar a{font-size:11px} }
  .solve-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap;font-size:14px}
  .solve-bar .btn{padding:9px 14px;font-size:14px}
  .reply.best{background:#F0FAF3;border-radius:12px;padding-left:8px;padding-right:8px;border-bottom-color:transparent}
  .best-tag{font-size:12px;font-weight:700;color:#1E7A45;background:#DDF4E6;border-radius:999px;padding:2px 8px}
  .hw-hello{background:linear-gradient(160deg,#E6EEFB,var(--mint))}
  .free-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px;text-decoration:none;color:inherit}
  .free-card .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--peach);display:grid;place-items:center;font-size:22px}
  .free-card .txt{flex:1;min-width:0}
  .free-card b{display:block;font-size:16px}
  .free-card span{color:var(--muted);font-size:14px}
  .free-card .go{flex:none;color:var(--green);font-weight:600;font-size:14px}
  .res{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
  .res .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-size:20px}
  .res .txt{flex:1;min-width:0}
  .res b{display:block}
  .res p{margin:2px 0 8px;color:var(--muted);font-size:14px}
  .grade-chip{display:inline-block;background:var(--mint);color:var(--green);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;margin-left:6px;vertical-align:middle}
  .auth-free{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:14px;font-size:14px}
  .auth-free .txt{flex:1;min-width:0}
  .auth-free{flex-wrap:wrap}
  .auth-free .txt{flex:1 1 180px}
  @media (max-width:520px){.auth-free .btn{width:100%}}
  a.btn{text-decoration:none}
  .res-files{display:flex;gap:8px;flex-wrap:wrap}
  .res-files .btn{padding:8px 12px;font-size:14px;color:var(--ink)}
  .seg-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;scrollbar-width:none}
  .seg-chips::-webkit-scrollbar{display:none}
  .gchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
  .gchip .n{margin-left:6px;font-size:12px;opacity:.75}
  .gchip.on{background:var(--green);border-color:var(--green);color:#fff}
  .agree{font-size:13px;color:var(--muted);margin:8px 0 0}
  .prof-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .blocked-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .blocked-row .btn{padding:7px 12px;font-size:14px}
  .settings a.row{display:flex;justify-content:space-between;align-items:center;width:100%;border-bottom:1px solid var(--line);padding:14px 4px;font-size:15px;color:inherit;text-decoration:none}
  .install{display:flex;align-items:center;gap:12px;background:var(--mint);border:1px solid #C9D8FF;border-radius:16px;padding:12px 14px;margin-bottom:14px}
  .install .ic{width:40px;height:40px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-size:19px;flex:none}
  .install .txt{flex:1;min-width:0;font-size:14px;line-height:1.35}
  .install .txt b{display:block;font-size:15px}
  .install .btn{padding:9px 14px;font-size:14px;flex:none}
  .install .x{background:none;border:0;color:var(--muted);font-size:20px;padding:2px 4px;flex:none;line-height:1}
  .steps{margin:10px 0 0;padding-left:22px}
  .steps li{margin:8px 0}
  .steps.big li{font-size:17px;margin:12px 0}
  .ios-arrow{position:fixed;right:28px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:40px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);animation:bob 1s ease-in-out infinite;z-index:61;pointer-events:none}
  @media (max-width:430px){ #auth .brand{font-size:0;gap:0} }
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
  .quote{background:var(--bg);border-radius:10px;padding:10px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
</style>
</head>
<body>

<div id="loading">…</div>

<!-- ================= SETUP NOTICE ================= -->
<div id="setup" class="hidden">
  <h2>Almost ready</h2>
  <p>Open <code>index.html</code>, find <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the bottom,
  and paste your Supabase <b>Project URL</b> and <b>anon public key</b>.</p>
</div>

<!-- ================= SIGN UP / LOG IN ================= -->
<section id="auth" class="hidden">
  <div class="auth-hero">
    <div class="wrap">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="brand"><div class="logo">P</div>Parents Meet <span>AI</span></div>
        <div style="display:flex;gap:8px;align-items:center"><span id="authGetApp"></span><button class="lang" data-lang-toggle></button></div>
      </div>
      <h1 data-i18n-html="heroTitle"></h1>
      <p data-i18n="heroText"></p>
      <div id="authFree"></div>
      <div id="authInstall" style="margin-top:16px"></div>
    </div>
  </div>

  <div class="auth-card">
    <div id="authForms">
      <div class="tabs">
        <button id="tabLogin" class="active" data-i18n="login"></button>
        <button id="tabSignup" data-i18n="signup"></button>
      </div>
      <form id="authForm" novalidate>
        <div id="nameWrap" class="hidden">
          <label class="field" for="dname" data-i18n="yourName"></label>

/* ---------- tiny DOM helper (all user text goes in as textContent) ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return el;
}
const COLORS = ["#2D5BD1","#FF7A59","#3F6FB5","#8A4FB0","#2E7D32","#B5503F","#0F7C7C","#A06A12"];
function colorFor(id){ let x = 0; for (const c of (id||"")) x = (x*31 + c.charCodeAt(0)) >>> 0; return COLORS[x % COLORS.length]; }
function avatar(p, size){
  p = p || {};
  if (p.avatar_url) return h("img", { class:"av av-"+size, src:p.avatar_url, alt:"" });
  return h("div", { class:"av av-"+size, style:"background:"+colorFor(p.id), "aria-hidden":"true" }, ((p.display_name||"?").trim()[0]||"?").toUpperCase());
}
function ago(iso){
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s < 45) return t("now");
  const rtf = new Intl.RelativeTimeFormat(lang === "zh" ? "zh-CN" : "en", { numeric:"auto", style:"short" });
  if (s < 3600) return rtf.format(-Math.round(s/60), "minute");
  if (s < 86400) return rtf.format(-Math.round(s/3600), "hour");
  if (s < 86400*7) return rtf.format(-Math.round(s/86400), "day");
  return new Date(iso).toLocaleDateString(lang === "zh" ? "zh-CN" : "en-US", { month:"short", day:"numeric", year:"numeric" });
}
function clock(iso){ return new Date(iso).toLocaleTimeString(lang === "zh" ? "zh-CN" : "en-US", { hour:"numeric", minute:"2-digit" }); }
function dayLabel(iso){
  const d = new Date(iso), n = new Date(), y = new Date(); y.setDate(n.getDate()-1);
  if (d.toDateString() === n.toDateString()) return t("today");
  if (d.toDateString() === y.toDateString()) return t("yesterday");
  return d.toLocaleDateString(lang === "zh" ? "zh-CN" : "en-US", { month:"short", day:"numeric" });
}
function toast(msg){
  const el = h("div", { class:"toast", role:"status" }, msg);
  document.body.append(el); setTimeout(() => el.remove(), 2600);
}
function friendly(err){
  const m = (err && err.message || String(err || "")).toLowerCase();
  if (m.includes("invalid login")) return t("badLogin");
  if (m.includes("not confirmed")) return t("notConfirmed");
  if (m.includes("already registered") || m.includes("already been registered")) return t("alreadyUser");
  if (m.includes("blocked") || (m.includes("row-level security") && m.includes("dm_messages"))) return t("cantMessage");
  return (err && err.message) || String(err);
}
function show(id){ ["loading","setup","auth","app"].forEach(x => $(x).classList.toggle("hidden", x !== id)); }
function clearSubs(){ subs.forEach(c => sb.removeChannel(c)); subs = []; }
function modal(content){
  const wrap = h("div", { class:"modal", onclick:e => { if (e.target === wrap) wrap.remove(); } }, h("div", { class:"card" }, content));
  document.body.append(wrap);
  return wrap;
}
function confirmBox(message, onYes, danger){
  const m = modal([
    h("p", { style:"margin:4px 0 0;font-size:16px" }, message),
    h("div", { class:"row-btns" },
      h("button", { class:"btn btn-ghost", onclick:() => m.remove() }, t("cancel")),
      h("button", { class:"btn " + (danger ? "btn-danger" : "btn-primary"), onclick:() => { m.remove(); onYes(); } }, danger ? t("del") : "OK"))
  ]);
}

const validEmail = e => /^\S+@\S+\.\S+$/.test(e);
const redirectUrl = () => location.origin + location.pathname;

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("authMsg"); msg.className = "err"; msg.textContent = "";
  const email = $("email").value.trim(), pw = $("password").value, name = $("dname").value.trim();
  if (authMode === "signup" && !name) return msg.textContent = t("errName");
  if (!validEmail(email)) return msg.textContent = t("errEmail");
  if (pw.length < 6) return msg.textContent = t("errPw");
  if (authMode === "signup" && !$("age").checked) return msg.textContent = t("errAge");
  const btn = $("authBtn"); btn.disabled = true; btn.textContent = t("wait");
  try {
    if (authMode === "signup") {
      const { data, error } = await sb.auth.signUp({ email, password: pw,
        options: { data: { display_name: name, parent_18_plus: true }, emailRedirectTo: redirectUrl() } });
      if (error) throw error;
      if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error("already registered");
      if (!data.session) { setAuthMode("login"); msg.className = "ok"; msg.textContent = t("checkEmail"); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
    }
  } catch (err) { msg.className = "err"; msg.textContent = friendly(err); }
  finally { btn.disabled = false; btn.textContent = authMode === "signup" ? t("signup") : t("login"); }
});

$("forgotForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("forgotMsg"); msg.className = "err"; msg.textContent = "";
  const email = $("femail").value.trim();
  if (!validEmail(email)) return msg.textContent = t("errEmail");
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl() });
  if (error) return msg.textContent = friendly(error);
  msg.className = "ok"; msg.textContent = t("resetSent");
});

$("newPwForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("newPwMsg"); msg.className = "err"; msg.textContent = "";
  const pw = $("newpw").value;
  if (pw.length < 6) return msg.textContent = t("errPw");

});

  const parts = (location.hash.replace(/^#\/?/, "") || "home").split("/");
  const view = $("view"); view.innerHTML = ""; window.scrollTo(0, 0);

async function likedPostIds(ids){
  if (!ids.length) return new Set();
  const { data } = await sb.from("post_likes").select("post_id").eq("user_id", me.id).in("post_id", ids);
  return new Set((data || []).map(r => r.post_id));
}
function likeButton(kind, row, liked){
  const table = kind === "post" ? "post_likes" : "reply_likes";
  const key = kind === "post" ? "post_id" : "reply_id";
  let isLiked = liked, count = row.like_count || 0;
  const btn = h("button", { class:"pill" + (isLiked ? " liked" : ""), "aria-pressed": String(isLiked), "aria-label":"Like" });
  const paint = () => { btn.className = "pill" + (isLiked ? " liked" : ""); btn.setAttribute("aria-pressed", String(isLiked)); btn.textContent = (isLiked ? "♥ " : "♡ ") + count; };
  paint();
  btn.addEventListener("click", async e => {
    e.stopPropagation(); btn.disabled = true;
    const was = isLiked; isLiked = !was; count += isLiked ? 1 : -1; paint();
    const res = was ? await sb.from(table).delete().eq(key, row.id).eq("user_id", me.id)
                    : await sb.from(table).insert({ [key]: row.id });
    if (res.error && res.error.code !== "23505") { isLiked = was; count += was ? 1 : -1; paint(); toast(friendly(res.error)); }
    btn.disabled = false;
  });
  return btn;
}

                 h("div", { class:"t" }, ago(iso) + (p.location ? " · 📍 " + locLabel(p.location) : ""))));
}
function postCard(p, liked){

  return h("article", { class:"card post-card", tabindex:"0", onclick:() => location.hash = "#/post/" + p.id,

async function renderPostList(container, query){
  const { data, error } = await query;
  if (error) throw error;
  const liked = await likedPostIds((data || []).map(p => p.id));
  (data || []).filter(p => !blocked.has(p.author_id)).forEach(p => container.append(postCard(p, liked.has(p.id))));
  return data || [];
}

let communitySort = "recent", communityLoc = "";
async function pageCommunity(view){
  setTop(t("navCommunity"));
  const input = h("input", { type:"search", placeholder:t("search"), "aria-label":t("search") });
  const newBtn = h("button", { class:"btn btn-primary", style:"flex:none", onclick:() => location.hash = "#/new", "aria-label":t("startDiscussion") }, "✏️");
  const segRecent = h("button", {}, t("recentTab")), segPop = h("button", {}, t("popular"));
  const list = h("div");
  const moreBtn = h("button", { class:"btn btn-ghost btn-block hidden" }, t("loadMore"));
  const locSel = locationSelect(communityLoc, true);
  locSel.addEventListener("change", () => { communityLoc = locSel.value; load(true); });
  view.append(h("div", { class:"toolbar" }, input, newBtn),
    h("div", { class:"locbar" }, h("span", { class:"muted" }, "📍 " + t("location") + ":"), locSel),
    h("div", { class:"seg" }, segRecent, segPop), list, moreBtn);

  const PAGE = 20; let offset = 0, term = "", token = 0;
  async function load(reset){
    const my = ++token;
    if (reset) { offset = 0; list.replaceChildren(h("p", { class:"muted" }, t("loading"))); }
    let q = sb.from("posts").select(POST_FIELDS).eq("kind", "discussion");
    if (term) q = q.or(`title.ilike.*${term}*,body.ilike.*${term}*`);
    if (communityLoc === "US:*") q = q.like("author.location", "US:%");
    else if (communityLoc) q = q.eq("author.location", communityLoc);
    q = communitySort === "popular" ? q.order("score", { ascending:false }).order("created_at", { ascending:false })
                                    : q.order("created_at", { ascending:false });
    q = q.range(offset, offset + PAGE - 1);
    const tmp = h("div"); const rows = await renderPostList(tmp, q);
    if (my !== token) return;
    if (reset) list.replaceChildren();
    list.append(...tmp.childNodes);
    offset += rows.length;
    moreBtn.classList.toggle("hidden", rows.length < PAGE);
    if (reset && !rows.length) list.append(h("div", { class:"empty" }, h("div", { class:"big" }, (term || communityLoc) ? "🔍" : "🌱"), term ? t("noResults") : communityLoc ? t("noLocalPosts") : t("noPosts")));
  }
  const paintSeg = () => { segRecent.classList.toggle("active", communitySort === "recent"); segPop.classList.toggle("active", communitySort === "popular"); };
  segRecent.onclick = () => { communitySort = "recent"; paintSeg(); load(true); };
  segPop.onclick = () => { communitySort = "popular"; paintSeg(); load(true); };
  moreBtn.onclick = () => load(false);
  let timer;
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => {
    term = input.value.replace(/[,()*%\\"'.:]/g, " ").trim().slice(0, 60); load(true); }, 300); });
  paintSeg(); await load(true);
}

function shrinkPhoto(file, maxSide){
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("image")), "image/jpeg", 0.85);
    };
    img.onerror = () => reject(new Error("image"));
    img.src = url;
  });
}

function shrinkImage(file, max){
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement("canvas");
      c.width = c.height = Math.min(max, s);
      c.getContext("2d").drawImage(img, (img.width - s)/2, (img.height - s)/2, s, s, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("image")), "image/jpeg", 0.85);
    };
    img.onerror = () => reject(new Error("image"));
    img.src = url;
  });
}

const PUSH_FN = SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/send-push";
function pushSupport(){

async function swReady(){

}

function b64uToBytes(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function savePushSub(sub){
  const j = sub.toJSON();
  const { error } = await sb.rpc("save_push_subscription", { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_lang: lang });
  if (error) throw error;

async function enablePush(){
  const sup = pushSupport();
  if (sup === "needInstall") return pushIosHelp();
  if (sup !== "ok") return toast(t("notifNo"));
  let perm = Notification.permission;
  if (perm === "default") perm = await Notification.requestPermission();   // must be the first thing after the tap (iPhone)
  if (perm !== "granted") return pushDeniedHelp();
  try {
    const reg = await swReady(); if (!reg) throw new Error("no service worker");
    const r = await fetch(PUSH_FN, { method:"POST", headers:{ "Content-Type":"application/json", apikey: SUPABASE_ANON_KEY }, body: JSON.stringify({ type:"key" }) });
    const { publicKey } = await r.json(); if (!publicKey) throw new Error("no key");
    let sub = await reg.pushManager.getSubscription();
    if (sub) {
      const old = sub.options && sub.options.applicationServerKey ? btoa(String.fromCharCode(...new Uint8Array(sub.options.applicationServerKey))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") : publicKey;
      if (old !== publicKey) { await sub.unsubscribe(); sub = null; }
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(publicKey) });
    await savePushSub(sub);
    try { localStorage.setItem("pmai-push-hide", "1"); } catch (e) {}
    document.querySelectorAll(".push-prompt").forEach(x => x.remove());
    toast(t("notifOnToast")); return true;
  } catch (e) { console.warn(e); toast(t("notifFail")); return false; }
}

  const sub = await currentPushSub();

  toast(t("notifOffToast"));
}

let freeBand = "all";
function freeItem(r, withLink){
  const [title, desc] = r[lang === "zh" ? "zh" : "en"];
  const kinds = [["notes", "📘", t("fNotes")], ["worksheet", "✏️", t("fWorksheet")], ["answers", "✅", t("fAnswers")]].filter(k => r.files[k[0]]);
  return h("div", { class:"res" },
    h("div", { class:"ic", "aria-hidden":"true" }, r.icon),
    h("div", { class:"txt" },
      h("b", {}, title, h("span", { class:"grade-chip" }, (lang === "zh" ? r.grade + " " + t("gradeLbl") : t("gradeLbl") + " " + r.grade))),
      h("p", {}, desc),
      withLink ? h("div", { class:"res-files" }, kinds.map(([k, ic, lbl]) => h("a", { class:"btn btn-ghost", href:r.files[k], target:"_blank", rel:"noopener" }, ic + " " + lbl)))
               : h("p", { class:"small", style:"margin:0" }, kinds.map(k => k[1] + " " + k[2]).join(" · "))));
}
function pageFree(view){
  setTop(t("freeTitle"), "#/home");
  view.append(h("p", { class:"muted", style:"margin:4px 0 12px" }, t("freeIntro")));
  const bandName = b => b[lang === "zh" ? "zh" : "en"];
  const count = id => FREE_MATH.filter(r => r.band === id).length;
  const list = h("div");
  const chips = h("div", { class:"seg-chips" },
    [{ id:"all", en:t("all"), zh:t("all") }].concat(GRADE_BANDS).map(b => {
      const n = b.id === "all" ? FREE_MATH.length : count(b.id);
      return h("button", { class:"gchip" + (freeBand === b.id ? " on" : ""), "aria-pressed": String(freeBand === b.id),
        onclick:e => { freeBand = b.id; chips.querySelectorAll(".gchip").forEach(x => { const on = x === e.currentTarget; x.classList.toggle("on", on); x.setAttribute("aria-pressed", String(on)); }); draw(); } },
        bandName(b), h("span", { class:"n" }, n));
    }));
  function draw(){
    list.replaceChildren();
    const bands = freeBand === "all" ? GRADE_BANDS.filter(b => count(b.id)) : GRADE_BANDS.filter(b => b.id === freeBand);
    bands.forEach(b => {
      list.append(h("div", { class:"section-title" }, h("h3", {}, lang === "zh" ? b.zh : "Grades " + b.en)));
      const items = FREE_MATH.filter(r => r.band === b.id);
      if (items.length) items.forEach(r => list.append(freeItem(r, true)));
      else list.append(h("div", { class:"empty", style:"padding:24px 10px" }, h("div", { class:"big" }, "🌱"), t("comingSoon")));
    });
  }
  view.append(chips, list); draw();
  if (FANGMATH_URL) view.append(h("div", { class:"hello", style:"margin-top:18px" },
    h("h1", { style:"font-size:22px" }, t("moreFrom")), h("p", {}, t("moreText")),
    h("a", { class:"btn btn-primary btn-block", href:FANGMATH_URL, target:"_blank", rel:"noopener" }, t("visitSite"))));
}
function showFreePreview(){
  const m = modal([h("h3", {}, "📐 " + t("freeTitle")), h("div", { style:"margin-top:10px" }, FREE_MATH.map(r => freeItem(r, false))),
    h("div", { class:"row-btns" }, h("button", { class:"btn btn-ghost", onclick:() => m.remove() }, t("close")),
      h("button", { class:"btn btn-primary", onclick:() => { m.remove(); setAuthMode("signup"); $("authForms").scrollIntoView({ behavior:"smooth" }); } }, t("signupFree")))]);
}
function renderAuthFree(){
  const slot = $("authFree"); if (!slot) return;
  slot.replaceChildren(h("div", { class:"auth-free" }, h("span", { style:"font-size:22px" }, "🎁"),
    h("div", { class:"txt" }, t("authFreeText")),
    h("button", { class:"btn btn-ghost", style:"padding:8px 12px", onclick:showFreePreview }, t("seeFree"))));
}
function renderAuthInstall(){
  renderAuthFree();
  const slot = $("authInstall"); if (slot) { slot.replaceChildren(); const b = installBanner(); if (b) slot.append(b); }
  const g = $("authGetApp"); if (g) { g.replaceChildren(); const btn = getAppButton(); if (btn) g.append(btn); }
}

applyStaticText(); setAuthMode("login"); renderAuthInstall();
if (!window.supabase || SUPABASE_URL.startsWith("PASTE") || SUPABASE_ANON_KEY.startsWith("PASTE")) {
  show("setup");
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      show("auth"); $("authForms").classList.add("hidden"); $("forgotForm").classList.add("hidden"); $("newPwForm").classList.remove("hidden");
      return;
    }
    if (event === "SIGNED_OUT") {
      me = null; myProfile = null; clearSubs(); setComposer(null);
      if (dmSub) { sb.removeChannel(dmSub); dmSub = null; }
      setAuthMode("login"); $("password").value = ""; $("age").checked = false;
      show("auth"); history.replaceState(null, "", location.pathname);
    }
    if (event === "SIGNED_IN" && session && (!me || me.id !== session.user.id) && $("newPwForm").classList.contains("hidden")) setTimeout(boot, 0);
  });
  if (!/type=recovery/.test(location.hash)) boot();
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
